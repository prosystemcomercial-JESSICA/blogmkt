    when_to_use: >
      Copy educativo, de produto ou conceitual. Imagem ilustra visualmente o tema sem precisar
      de contexto do texto. Ideal para mostrar resultado, produto ou cena específica no topo.
    when_NOT_to_use: >
      Imagem panorâmica que perde impacto em metade do frame. Copy muito curto.
    created_at: "2026-05-07"
    created_from:
      run: biblioteca-inicial
      client: base
      copy_theme: educativo-produto
    used_by: []

