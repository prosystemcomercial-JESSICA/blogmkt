    layout_letter: F
    tags: [tipografico, sem-imagem, destaque-numerico, promessa-valor, fundo-solido, bloco-central, corporativo-b2b]
    zones: [zone-logo, zone-pre-headline, zone-headline, zone-subheadline, zone-cta]
    when_to_use: >
      Copy com número ou palavra-chave de alto impacto que merece isolamento em linha própria
      (ex: "10x mais", "R$1M", "100%"). Promessa de valor direta e forte. Público B2B.
      Headline curta a média com âncora numérica ou declarativa.
    when_NOT_to_use: >
      Copy sem elemento numérico ou palavra-chave de destaque. Copy longo ou técnico.
      Tom casual/lúdico. Quando imagem for disponível e amplificar a mensagem.
