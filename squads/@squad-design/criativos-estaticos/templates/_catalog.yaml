# ExpxAgents — Arte Estática Feed — Templates Catalog
#
# ─── O que é este arquivo ───────────────────────────────────────────────
# Biblioteca de templates HTML "puros" — estrutura, zonas e proporções,
# sem identidade visual aplicada. Gerados automaticamente pelo Banguela
# toda vez que uma arte é aprovada pelo avaliador (step-05 do pipeline).
#
# ─── Regras do catálogo ─────────────────────────────────────────────────
# 1. Felipe Torres consulta este catálogo ANTES de criar spec do zero.
# 2. Nasce um template novo por cada run aprovada.
# 3. Cooldown por cliente: não reusar mesmo `template_id` para mesmo
#    cliente dentro de `cooldown_days` (default 30 dias).
# 4. Nunca rodar 2 artes consecutivas do mesmo cliente no mesmo
#    `layout_letter` — Felipe deve variar entre A-I.
# 5. Alfandega consulta o catálogo para avaliar "Erro D — diversidade
#    visual" contra as últimas entregas daquele cliente.

config:
  default_cooldown_days: 30
  max_consecutive_same_layout_per_client: 1

templates:
  - id: t01-fullbleed-overlay
    file: templates/t01-fullbleed-overlay.html
    layout: FullBleed com overlay
    layout_letter: H
    tags: [fullbleed, overlay, gradiente, atmosférico, foto-fundo, narrativa]
    zones: [zone-image, zone-logo, zone-pre-headline, zone-headline, zone-subheadline, zone-cta]
    when_to_use: >
      Copy de autoridade, storytelling ou posicionamento de marca. Imagem tem boa qualidade
      fotográfica e suporta overlay escuro sem perder impacto. Headline curta a média.
    when_NOT_to_use: >
      Copy longo ou com lista. Imagem muito escura. CTA muito detalhado.
    created_at: "2026-05-07"
    created_from:
      run: biblioteca-inicial
      client: base
      copy_theme: autoridade-narrativa
    used_by: []

  - id: t02-split-imagem-topo
    file: templates/t02-split-imagem-topo.html
