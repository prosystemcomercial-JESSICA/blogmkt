<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <link href="https://fonts.googleapis.com/css2?family={{FONT_FAMILY}}:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: {{COLOR_PRIMARY}};
      --secondary: {{COLOR_SECONDARY}};
      --accent: {{COLOR_ACCENT}};
      --font-family: '{{FONT_FAMILY}}', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      font-family: var(--font-family);
      background: var(--primary);
      display: flex;
      flex-direction: row;
    }

    /* ZONA: Imagem — coluna esquerda (42%) */
    .zone-image {
      width: 454px; /* 42% de 1080 */
      height: 100%;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }

    .zone-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* Gradiente lateral — transição suave imagem → fundo */
    .zone-image::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 100px;
      background: linear-gradient(to right, transparent, var(--primary));
    }

    /* ZONA: Conteúdo — coluna direita (58%) */
    .zone-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 108px 90px 108px 60px;
      position: relative;
    }

    /* ZONA: Logo — topo da coluna de texto */
    .zone-logo {
      position: absolute;
      top: 72px;
      right: 90px;
    }

    .zone-logo img {
      height: 40px;
      width: auto;
      object-fit: contain;
    }

    /* Linha decorativa */
    .divider {
      width: 50px;
      height: 4px;
      background: var(--accent);
      margin-bottom: 32px;
      border-radius: 2px;
    }

    /* ZONA: Pre-headline */
    .zone-pre-headline {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 18px;
      display: none;
    }

    /* ZONA: Headline */
    .zone-headline {
      font-size: 62px;
      font-weight: 800;
      line-height: 1.1;
      color: #FFFFFF;
      margin-bottom: 24px;
    }

    .zone-headline .destaque {
      color: var(--accent);
    }

    /* ZONA: Subheadline */
    .zone-subheadline {
      font-size: 28px;
      font-weight: 400;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.80);
      margin-bottom: 40px;
    }

    /* ZONA: CTA */
    .zone-cta {
      display: inline-block;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 24px;
      font-weight: 700;
      padding: 16px 34px;
      border-radius: 6px;
      align-self: flex-start;
    }
  </style>
</head>
<body>

  <!-- Coluna esquerda: imagem -->
  <div class="zone-image">
    <img src="{{IMAGE_URL}}" alt="{{IMAGE_ALT}}">
  </div>

  <!-- Coluna direita: texto -->
  <div class="zone-content">
    <div class="zone-logo">
      <img src="{{LOGO_URL}}" alt="Logo">
    </div>
    <div class="divider"></div>
    <div class="zone-pre-headline">{{PRE_HEADLINE}}</div>
    <div class="zone-headline">{{HEADLINE}}</div>
    <div class="zone-subheadline">{{SUBHEADLINE}}</div>
    <div class="zone-cta">{{CTA}}</div>
  </div>

</body>
</html>
