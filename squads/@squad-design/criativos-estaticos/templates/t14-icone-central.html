<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <link href="https://fonts.googleapis.com/css2?family={{FONT_FAMILY}}:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: {{COLOR_PRIMARY}};
      --secondary: {{COLOR_SECONDARY}};
      --accent: {{COLOR_ACCENT}};
      --font-family: '{{FONT_FAMILY}}', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      font-family: var(--font-family);
      background: var(--primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Imagem de fundo fullbleed */
    .zone-bg-image {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    .zone-bg-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* Overlay com gradiente sutil */
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        160deg,
        rgba(2, 20, 2, 0.88) 0%,
        rgba(5, 46, 5, 0.78) 50%,
        rgba(44, 50, 88, 0.82) 100%
      );
      z-index: 1;
    }

    /* ZONA: Logo — topo esquerdo */
    .zone-logo {
      position: absolute;
      top: 72px;
      left: 108px;
      z-index: 3;
    }

    .zone-logo img {
      height: 44px;
      width: auto;
      object-fit: contain;
    }

    /* ZONA: Conteúdo central */
    .zone-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 108px;
      z-index: 3;
      position: relative;
    }

    /* ZONA: Ícone central — SVG ou img */
    .zone-icon {
      width: 220px;
      height: 220px;
      border-radius: 40px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 56px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .zone-icon img {
      width: 130px;
      height: 130px;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }

    /* ZONA: Pre-headline */
    .zone-pre-headline {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 24px;
      display: none;
    }

    /* ZONA: Headline */
    .zone-headline {
      font-size: 72px;
      font-weight: 900;
      line-height: 1.1;
      color: #FFFFFF;
      margin-bottom: 28px;
    }

    .zone-headline .destaque {
      color: var(--accent);
    }

    /* Linha divisória */
    .divider {
      width: 60px;
      height: 4px;
      background: var(--accent);
      border-radius: 2px;
      margin-bottom: 32px;
    }

    /* ZONA: Subheadline */
    .zone-subheadline {
      font-size: 32px;
      font-weight: 400;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.80);
      margin-bottom: 56px;
    }

    /* ZONA: CTA */
    .zone-cta {
      display: inline-block;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 26px;
      font-weight: 700;
      padding: 18px 40px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div class="zone-bg-image">
    <img src="{{IMAGE_BG_URL}}" alt="{{IMAGE_BG_ALT}}">
  </div>
  <div class="overlay"></div>

  <!-- Logo -->
  <div class="zone-logo">
    <img src="{{LOGO_URL}}" alt="Logo">
  </div>

  <div class="zone-content">
    <div class="zone-icon">
      <img src="{{ICON_URL}}" alt="{{ICON_ALT}}">
    </div>
    <div class="zone-pre-headline">{{PRE_HEADLINE}}</div>
    <div class="zone-headline">{{HEADLINE}}</div>
    <div class="divider"></div>
    <div class="zone-subheadline">{{SUBHEADLINE}}</div>
    <div class="zone-cta">{{CTA}}</div>
  </div>

</body>
</html>
