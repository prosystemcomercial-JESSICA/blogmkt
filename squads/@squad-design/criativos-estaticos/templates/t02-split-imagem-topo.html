<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <link href="https://fonts.googleapis.com/css2?family={{FONT_FAMILY}}:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: {{COLOR_PRIMARY}};
      --secondary: {{COLOR_SECONDARY}};
      --accent: {{COLOR_ACCENT}};
      --font-family: '{{FONT_FAMILY}}', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      font-family: var(--font-family);
      background: var(--primary);
      display: flex;
      flex-direction: column;
    }

    /* ZONA: Imagem — metade superior (55%) */
    .zone-image {
      width: 100%;
      height: 742px; /* 55% de 1350 */
      position: relative;
      flex-shrink: 0;
    }

    .zone-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    /* Gradiente de transição imagem → fundo */
    .zone-image::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 120px;
      background: linear-gradient(to bottom, transparent, var(--primary));
    }

    /* ZONA: Conteúdo de texto — metade inferior (45%) */
    .zone-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 48px 108px 108px 108px;
      position: relative;
    }

    /* ZONA: Logo — dentro do bloco de texto, topo */
    .zone-logo {
      position: absolute;
      top: 36px;
      right: 108px;
    }

    .zone-logo img {
      height: 40px;
      width: auto;
      object-fit: contain;
    }

    /* ZONA: Pre-headline (opcional) */
    .zone-pre-headline {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 20px;
      display: none;
    }

    /* ZONA: Headline */
    .zone-headline {
      font-size: 68px;
      font-weight: 800;
      line-height: 1.1;
      color: #FFFFFF;
      margin-bottom: 22px;
    }

    .zone-headline .destaque {
      color: var(--accent);
    }

    /* ZONA: Subheadline */
    .zone-subheadline {
      font-size: 30px;
      font-weight: 400;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.80);
      margin-bottom: 36px;
    }

    /* ZONA: CTA */
    .zone-cta {
      display: inline-block;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 24px;
      font-weight: 700;
      padding: 16px 36px;
      border-radius: 6px;
      align-self: flex-start;
    }

    /* Linha decorativa separadora (opcional) */
    .divider {
      width: 60px;
      height: 4px;
      background: var(--accent);
      margin-bottom: 28px;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <!-- Imagem topo -->
  <div class="zone-image">
    <img src="{{IMAGE_URL}}" alt="{{IMAGE_ALT}}">
  </div>

  <!-- Conteúdo texto -->
  <div class="zone-content">
    <div class="zone-logo">
      <img src="{{LOGO_URL}}" alt="Logo">
    </div>
    <div class="zone-pre-headline">{{PRE_HEADLINE}}</div>
    <div class="divider"></div>
    <div class="zone-headline">{{HEADLINE}}</div>
    <div class="zone-subheadline">{{SUBHEADLINE}}</div>
    <div class="zone-cta">{{CTA}}</div>
  </div>

</body>
</html>
