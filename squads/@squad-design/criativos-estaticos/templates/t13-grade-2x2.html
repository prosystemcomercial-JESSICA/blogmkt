<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <link href="https://fonts.googleapis.com/css2?family={{FONT_FAMILY}}:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: {{COLOR_PRIMARY}};
      --secondary: {{COLOR_SECONDARY}};
      --accent: {{COLOR_ACCENT}};
      --font-family: '{{FONT_FAMILY}}', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      font-family: var(--font-family);
      background: var(--primary);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ZONA: Grade 2x2 — ocupa parte superior (68%) */
    .zone-grid {
      width: 100%;
      height: 918px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 6px;
      flex-shrink: 0;
    }

    .grid-cell {
      position: relative;
      overflow: hidden;
    }

    .grid-cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* Overlay leve sobre cada célula */
    .grid-cell::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.15);
    }

    /* Gradiente de saída da grade para o rodapé */
    .zone-grid::after {
      content: '';
      position: absolute;
      bottom: 432px;
      left: 0;
      right: 0;
      height: 120px;
      background: linear-gradient(to bottom, transparent, var(--primary));
      pointer-events: none;
      z-index: 1;
    }

    /* ZONA: Logo — topo esquerdo sobre a grade */
    .zone-logo {
      position: absolute;
      top: 72px;
      left: 108px;
      z-index: 3;
    }

    .zone-logo img {
      height: 44px;
      width: auto;
      object-fit: contain;
    }

    /* ZONA: Conteúdo de texto — parte inferior (32%) */
    .zone-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 32px 108px 100px 108px;
      position: relative;
      z-index: 2;
    }

    /* ZONA: Pre-headline */
    .zone-pre-headline {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
      display: none;
    }

    /* ZONA: Headline */
    .zone-headline {
      font-size: 58px;
      font-weight: 800;
      line-height: 1.1;
      color: #FFFFFF;
      margin-bottom: 18px;
    }

    .zone-headline .destaque {
      color: var(--accent);
    }

    /* ZONA: Subheadline */
    .zone-subheadline {
      font-size: 26px;
      font-weight: 400;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 32px;
    }

    /* ZONA: CTA */
    .zone-cta {
      display: inline-block;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 24px;
      font-weight: 700;
      padding: 16px 36px;
      border-radius: 6px;
      align-self: flex-start;
    }
  </style>
</head>
<body>

  <!-- Grade 2x2 -->
  <div class="zone-grid">
    <div class="grid-cell"><img src="{{IMAGE1_URL}}" alt="{{IMAGE1_ALT}}"></div>
    <div class="grid-cell"><img src="{{IMAGE2_URL}}" alt="{{IMAGE2_ALT}}"></div>
    <div class="grid-cell"><img src="{{IMAGE3_URL}}" alt="{{IMAGE3_ALT}}"></div>
    <div class="grid-cell"><img src="{{IMAGE4_URL}}" alt="{{IMAGE4_ALT}}"></div>
  </div>

  <!-- Logo sobre a grade -->
  <div class="zone-logo">
    <img src="{{LOGO_URL}}" alt="Logo">
  </div>

  <!-- Texto rodapé -->
  <div class="zone-content">
    <div class="zone-pre-headline">{{PRE_HEADLINE}}</div>
    <div class="zone-headline">{{HEADLINE}}</div>
    <div class="zone-subheadline">{{SUBHEADLINE}}</div>
    <div class="zone-cta">{{CTA}}</div>
  </div>

</body>
</html>
