<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <link href="https://fonts.googleapis.com/css2?family={{FONT_FAMILY}}:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: {{COLOR_PRIMARY}};
      --secondary: {{COLOR_SECONDARY}};
      --accent: {{COLOR_ACCENT}};
      --font-family: '{{FONT_FAMILY}}', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      font-family: var(--font-family);
      background: var(--primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* ZONA: Logo — topo esquerdo */
    .zone-logo {
      position: absolute;
      top: 72px;
      left: 108px;
      z-index: 2;
    }

    .zone-logo img {
      height: 44px;
      width: auto;
      object-fit: contain;
    }

    /* ZONA: Conteúdo central */
    .zone-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 108px;
      z-index: 2;
      position: relative;
    }

    /* ZONA: Pre-headline */
    .zone-pre-headline {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 32px;
      display: none;
    }

    /* ZONA: Número principal — protagonista */
    .zone-number {
      font-size: 280px;
      font-weight: 900;
      line-height: 0.85;
      color: var(--accent);
      margin-bottom: 16px;
    }

    /* Unidade / sufixo do número */
    .zone-number-unit {
      font-size: 80px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.60);
      margin-bottom: 48px;
    }

    /* Linha divisória */
    .divider {
      width: 80px;
      height: 4px;
      background: var(--accent);
      border-radius: 2px;
      margin-bottom: 48px;
    }

    /* ZONA: Headline */
    .zone-headline {
      font-size: 60px;
      font-weight: 800;
      line-height: 1.15;
      color: #FFFFFF;
      margin-bottom: 28px;
    }

    .zone-headline .destaque {
      color: var(--accent);
    }

    /* ZONA: Subheadline */
    .zone-subheadline {
      font-size: 30px;
      font-weight: 400;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 56px;
    }

    /* ZONA: CTA */
    .zone-cta {
      display: inline-block;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 26px;
      font-weight: 700;
      padding: 18px 40px;
      border-radius: 6px;
    }

    /* Rodapé fixo com subheadline adicional */
    .zone-footer-note {
      position: absolute;
      bottom: 80px;
      left: 108px;
      right: 108px;
      font-size: 20px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.40);
      text-align: center;
      z-index: 3;
    }
  </style>
</head>
<body>

  <!-- Logo -->
  <div class="zone-logo">
    <img src="{{LOGO_URL}}" alt="Logo">
  </div>

  <div class="zone-content">
    <div class="zone-pre-headline">{{PRE_HEADLINE}}</div>
    <div class="zone-number">{{NUMBER}}</div>
    <div class="zone-number-unit">{{NUMBER_UNIT}}</div>
    <div class="divider"></div>
    <div class="zone-headline">{{HEADLINE}}</div>
    <div class="zone-subheadline">{{SUBHEADLINE}}</div>
    <div class="zone-cta">{{CTA}}</div>
  </div>

  <div class="zone-footer-note">{{FOOTER_NOTE}}</div>

</body>
</html>
