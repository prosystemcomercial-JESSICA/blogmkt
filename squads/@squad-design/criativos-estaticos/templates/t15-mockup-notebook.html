<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <link href="https://fonts.googleapis.com/css2?family={{FONT_FAMILY}}:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: {{COLOR_PRIMARY}};
      --secondary: {{COLOR_SECONDARY}};
      --accent: {{COLOR_ACCENT}};
      --font-family: '{{FONT_FAMILY}}', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      font-family: var(--font-family);
      background: var(--primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Imagem de fundo fullbleed */
    .zone-bg-image {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    .zone-bg-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* Overlay com gradiente sutil */
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        160deg,
        rgba(2, 20, 2, 0.92) 0%,
        rgba(5, 46, 5, 0.85) 50%,
        rgba(44, 50, 88, 0.88) 100%
      );
      z-index: 1;
    }

    /* ZONA: Logo — topo esquerdo */
    .zone-logo {
      position: absolute;
      top: 72px;
      left: 108px;
      z-index: 3;
    }

    .zone-logo img {
      height: 44px;
      width: auto;
      object-fit: contain;
    }

    /* ZONA: Conteúdo */
    .zone-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 80px;
      z-index: 3;
      position: relative;
      width: 100%;
    }

    /* ZONA: Pre-headline */
    .zone-pre-headline {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 20px;
      display: none;
    }

    /* ZONA: Headline */
    .zone-headline {
      font-size: 58px;
      font-weight: 900;
      line-height: 1.1;
      color: #FFFFFF;
      margin-bottom: 16px;
    }

    .zone-headline .destaque {
      color: var(--accent);
    }

    /* ZONA: Subheadline */
    .zone-subheadline {
      font-size: 26px;
      font-weight: 400;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.70);
      margin-bottom: 48px;
    }

    /* MOCKUP: Notebook */
    .mockup-notebook {
      position: relative;
      width: 860px;
      margin-bottom: 48px;
    }

    /* Tampa/tela do notebook */
    .notebook-screen-wrap {
      position: relative;
      width: 100%;
      background: #1a1a1a;
      border-radius: 16px 16px 0 0;
      padding: 18px 22px 14px 22px;
      box-shadow:
        0 0 0 2px #333,
        0 24px 60px rgba(0,0,0,0.7);
    }

    /* Câmera */
    .notebook-camera {
      width: 8px;
      height: 8px;
      background: #444;
      border-radius: 50%;
      margin: 0 auto 10px auto;
    }

    /* Área da tela */
    .notebook-screen {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 4px;
      overflow: hidden;
      background: #000;
      position: relative;
    }

    .notebook-screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top left;
      display: block;
    }

    /* Base/teclado do notebook */
    .notebook-base {
      width: 100%;
      height: 20px;
      background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%);
      border-radius: 0 0 4px 4px;
      box-shadow: 0 2px 0 #111;
    }

    /* Suporte/pé */
    .notebook-foot {
      width: 70%;
      height: 10px;
      background: #151515;
      border-radius: 0 0 12px 12px;
      margin: 0 auto;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }

    /* ZONA: CTA */
    .zone-cta {
      display: inline-block;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 26px;
      font-weight: 700;
      padding: 18px 48px;
      border-radius: 6px;
    }

    /* Rodapé */
    .zone-footer-note {
      position: absolute;
      bottom: 60px;
      left: 108px;
      right: 108px;
      font-size: 18px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.35);
      text-align: center;
      z-index: 3;
    }
  </style>
</head>
<body>

  <div class="zone-bg-image">
    <img src="{{IMAGE_BG_URL}}" alt="{{IMAGE_BG_ALT}}">
  </div>
  <div class="overlay"></div>

  <!-- Logo -->
  <div class="zone-logo">
    <img src="{{LOGO_URL}}" alt="Logo">
  </div>

  <div class="zone-content">
    <div class="zone-pre-headline">{{PRE_HEADLINE}}</div>
    <div class="zone-headline">{{HEADLINE}}</div>
    <div class="zone-subheadline">{{SUBHEADLINE}}</div>

    <!-- Mockup Notebook -->
    <div class="mockup-notebook">
      <div class="notebook-screen-wrap">
        <div class="notebook-camera"></div>
        <div class="notebook-screen">
          <img src="{{SCREEN_URL}}" alt="{{SCREEN_ALT}}">
        </div>
      </div>
      <div class="notebook-base"></div>
      <div class="notebook-foot"></div>
    </div>

    <div class="zone-cta">{{CTA}}</div>
  </div>

  <div class="zone-footer-note">{{FOOTER_NOTE}}</div>

</body>
</html>
