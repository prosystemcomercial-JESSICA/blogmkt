<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <link href="https://fonts.googleapis.com/css2?family={{FONT_FAMILY}}:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: {{COLOR_PRIMARY}};
      --secondary: {{COLOR_SECONDARY}};
      --accent: {{COLOR_ACCENT}};
      --font-family: '{{FONT_FAMILY}}', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      font-family: var(--font-family);
      background: var(--primary);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* ZONA: Logo — topo esquerdo */
    .zone-logo {
      position: absolute;
      top: 72px;
      left: 108px;
      z-index: 2;
    }

    .zone-logo img {
      height: 44px;
      width: auto;
      object-fit: contain;
    }

    /* ZONA: Conteúdo central */
    .zone-content {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 160px 108px 240px 108px;
      z-index: 3;
    }

    /* ZONA: Foto do autor — círculo */
    .zone-avatar {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      overflow: hidden;
      border: 6px solid var(--accent);
      margin-bottom: 56px;
      flex-shrink: 0;
    }

    .zone-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    /* Aspas decorativas */
    .zone-quote-mark {
      font-size: 160px;
      font-weight: 800;
      line-height: 0.7;
      color: var(--accent);
      opacity: 0.3;
      align-self: flex-start;
      margin-bottom: 8px;
    }

    /* ZONA: Texto da citação */
    .zone-quote {
      font-size: 52px;
      font-weight: 700;
      line-height: 1.2;
      color: #FFFFFF;
      text-align: center;
      margin-bottom: 48px;
    }

    .zone-quote .destaque {
      color: var(--accent);
    }

    /* ZONA: Linha divisória */
    .divider {
      width: 60px;
      height: 4px;
      background: var(--accent);
      border-radius: 2px;
      margin-bottom: 32px;
    }

    /* ZONA: Nome do autor */
    .zone-author-name {
      font-size: 30px;
      font-weight: 700;
      color: #FFFFFF;
      text-align: center;
      margin-bottom: 10px;
    }

    /* ZONA: Cargo / empresa do autor */
    .zone-author-role {
      font-size: 22px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.65);
      text-align: center;
      letter-spacing: 1px;
    }

    /* ZONA: Pre-headline (opcional) */
    .zone-pre-headline {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      text-align: center;
      margin-bottom: 32px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Logo -->
  <div class="zone-logo">
    <img src="{{LOGO_URL}}" alt="Logo">
  </div>

  <!-- Conteúdo central -->
  <div class="zone-content">
    <div class="zone-avatar">
      <img src="{{AVATAR_URL}}" alt="{{AUTHOR_NAME}}">
    </div>
    <div class="zone-pre-headline">{{PRE_HEADLINE}}</div>
    <div class="zone-quote-mark">"</div>
    <div class="zone-quote">{{QUOTE}}</div>
    <div class="divider"></div>
    <div class="zone-author-name">{{AUTHOR_NAME}}</div>
    <div class="zone-author-role">{{AUTHOR_ROLE}}</div>
  </div>

</body>
</html>
