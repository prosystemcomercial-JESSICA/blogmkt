<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <link href="https://fonts.googleapis.com/css2?family={{FONT_FAMILY}}:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: {{COLOR_PRIMARY}};
      --secondary: {{COLOR_SECONDARY}};
      --accent: {{COLOR_ACCENT}};
      --font-family: '{{FONT_FAMILY}}', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      font-family: var(--font-family);
      background: var(--primary);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ZONA: Imagem do produto — área superior (58%) */
    .zone-image {
      width: 100%;
      height: 783px;
      flex-shrink: 0;
      position: relative;
      background: var(--secondary);
      overflow: hidden;
    }

    .zone-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* Gradiente de transição imagem → fundo */
    .zone-image::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 140px;
      background: linear-gradient(to bottom, transparent, var(--primary));
    }

    /* ZONA: Logo — topo esquerdo sobre a imagem */
    .zone-logo {
      position: absolute;
      top: 72px;
      left: 108px;
      z-index: 2;
    }

    .zone-logo img {
      height: 44px;
      width: auto;
      object-fit: contain;
    }

    /* ZONA: Tag de destaque — topo direito */
    .zone-tag {
      position: absolute;
      top: 80px;
      right: 108px;
      z-index: 2;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 12px 24px;
      border-radius: 4px;
      display: none;
    }

    /* ZONA: Bloco de preço — sobreposto sobre a imagem, canto inferior direito */
    .zone-price-badge {
      position: absolute;
      bottom: 80px;
      right: 108px;
      z-index: 3;
      background: var(--accent);
      border-radius: 16px;
      padding: 24px 36px;
      text-align: right;
    }

    .price-from {
      font-size: 20px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.75);
      text-decoration: line-through;
      margin-bottom: 4px;
    }

    .price-main {
      font-size: 64px;
      font-weight: 900;
      color: #FFFFFF;
      line-height: 1;
    }

    .price-detail {
      font-size: 20px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.80);
      margin-top: 6px;
    }

    /* ZONA: Conteúdo de texto — parte inferior */
    .zone-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px 108px 100px 108px;
    }

    /* ZONA: Pre-headline */
    .zone-pre-headline {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
      display: none;
    }

    /* ZONA: Headline */
    .zone-headline {
      font-size: 60px;
      font-weight: 800;
      line-height: 1.1;
      color: #FFFFFF;
      margin-bottom: 18px;
    }

    .zone-headline .destaque {
      color: var(--accent);
    }

    /* ZONA: Subheadline */
    .zone-subheadline {
      font-size: 28px;
      font-weight: 400;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 36px;
    }

    /* ZONA: CTA */
    .zone-cta {
      display: inline-block;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 26px;
      font-weight: 700;
      padding: 18px 40px;
      border-radius: 6px;
      align-self: flex-start;
    }
  </style>
</head>
<body>

  <!-- Imagem do produto -->
  <div class="zone-image">
    <img src="{{IMAGE_URL}}" alt="{{IMAGE_ALT}}">
  </div>

  <!-- Logo -->
  <div class="zone-logo">
    <img src="{{LOGO_URL}}" alt="Logo">
  </div>

  <!-- Tag opcional -->
  <div class="zone-tag">{{TAG}}</div>

  <!-- Badge de preço -->
  <div class="zone-price-badge">
    <div class="price-from">{{PRICE_FROM}}</div>
    <div class="price-main">{{PRICE_MAIN}}</div>
    <div class="price-detail">{{PRICE_DETAIL}}</div>
  </div>

  <!-- Texto -->
  <div class="zone-content">
    <div class="zone-pre-headline">{{PRE_HEADLINE}}</div>
    <div class="zone-headline">{{HEADLINE}}</div>
    <div class="zone-subheadline">{{SUBHEADLINE}}</div>
    <div class="zone-cta">{{CTA}}</div>
  </div>

</body>
</html>
