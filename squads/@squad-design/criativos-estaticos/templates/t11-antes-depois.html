<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <link href="https://fonts.googleapis.com/css2?family={{FONT_FAMILY}}:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: {{COLOR_PRIMARY}};
      --secondary: {{COLOR_SECONDARY}};
      --accent: {{COLOR_ACCENT}};
      --font-family: '{{FONT_FAMILY}}', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      font-family: var(--font-family);
      background: var(--primary);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ZONA: Logo — topo esquerdo */
    .zone-logo {
      position: absolute;
      top: 72px;
      left: 108px;
      z-index: 3;
    }

    .zone-logo img {
      height: 44px;
      width: auto;
      object-fit: contain;
    }

    /* ZONA: Headline — topo, sobre o bloco de imagens */
    .zone-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 220px;
      background: var(--primary);
      display: flex;
      align-items: flex-end;
      padding: 0 108px 32px 108px;
      z-index: 2;
    }

    .zone-headline {
      font-size: 60px;
      font-weight: 800;
      line-height: 1.1;
      color: #FFFFFF;
    }

    .zone-headline .destaque {
      color: var(--accent);
    }

    /* ZONA: Bloco de imagens lado a lado — área central */
    .zone-images {
      position: absolute;
      top: 220px;
      left: 0;
      right: 0;
      height: 840px;
      display: flex;
      flex-direction: row;
    }

    /* Coluna antes */
    .col-before,
    .col-after {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .col-before img,
    .col-after img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* Overlay escuro para legibilidade dos labels */
    .col-before::after,
    .col-after::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
    }

    /* Divisor central */
    .col-divider {
      width: 6px;
      background: #FFFFFF;
      flex-shrink: 0;
      position: relative;
      z-index: 2;
    }

    .col-divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #FFFFFF;
    }

    /* Labels Antes / Depois */
    .label {
      position: absolute;
      top: 32px;
      z-index: 3;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #FFFFFF;
      padding: 10px 20px;
      border-radius: 4px;
    }

    .label-before {
      left: 24px;
      background: rgba(0, 0, 0, 0.50);
    }

    .label-after {
      right: 24px;
      background: var(--accent);
    }

    /* ZONA: Rodapé com subheadline e CTA */
    .zone-footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 290px;
      background: var(--primary);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 108px;
      z-index: 2;
    }

    /* ZONA: Pre-headline */
    .zone-pre-headline {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
      display: none;
    }

    .zone-subheadline {
      font-size: 30px;
      font-weight: 400;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.80);
      margin-bottom: 28px;
    }

    .zone-cta {
      display: inline-block;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 24px;
      font-weight: 700;
      padding: 16px 36px;
      border-radius: 6px;
      align-self: flex-start;
    }
  </style>
</head>
<body>

  <!-- Logo -->
  <div class="zone-logo">
    <img src="{{LOGO_URL}}" alt="Logo">
  </div>

  <!-- Header com headline -->
  <div class="zone-header">
    <div class="zone-headline">{{HEADLINE}}</div>
  </div>

  <!-- Bloco de imagens antes/depois -->
  <div class="zone-images">
    <div class="col-before">
      <img src="{{IMAGE_BEFORE_URL}}" alt="Antes">
      <div class="label label-before">{{LABEL_BEFORE}}</div>
    </div>
    <div class="col-divider"></div>
    <div class="col-after">
      <img src="{{IMAGE_AFTER_URL}}" alt="Depois">
      <div class="label label-after">{{LABEL_AFTER}}</div>
    </div>
  </div>

  <!-- Rodapé -->
  <div class="zone-footer">
    <div class="zone-pre-headline">{{PRE_HEADLINE}}</div>
    <div class="zone-subheadline">{{SUBHEADLINE}}</div>
    <div class="zone-cta">{{CTA}}</div>
  </div>

</body>
</html>
