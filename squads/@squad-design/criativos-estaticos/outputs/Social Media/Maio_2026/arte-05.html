    .multa-value {

      line-height: 0.88;
      color: #FFFFFF;
      text-shadow: 0 6px 40px rgba(0,0,0,0.4);
      display: inline-block;
    }

    /* Linha separadora */
    .divider {

      right: 108px;
      height: 1px;
      background: rgba(255, 255, 255, 0.18);

      position: absolute;
      top: 762px;
      left: 108px;
      right: 108px;
      display: flex;
      align-items: center;
      z-index: 3;
    }

    .multa-item {

    }

    .multa-item .m-value {
      font-size: 44px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1;
    }

    .multa-item .m-label {
      font-family: 'Inter', sans-serif;
      font-size: 18px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.50);

      font-family: 'Inter', sans-serif;
      font-size: 28px;
      font-weight: 700;
      padding: 20px 56px;
      border-radius: 9px;
      z-index: 3;
    }
  </style>
</head>
