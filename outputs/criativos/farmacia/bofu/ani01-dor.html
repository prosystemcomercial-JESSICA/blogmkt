<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1350px; overflow:hidden; font-family:'Montserrat',sans-serif; }

.ad { width:1080px; height:1350px; position:relative; overflow:hidden; background:#009fe3; }

/* FOTO */
.photo {
  position:absolute; inset:0;
  background: url('file:///C:/Users/prosy/Desktop/PROJETOS/AUTOMAÇÃO MKT PROSYSTEM/banco imagens/farmacia/ictq-varejo_farmaceutico-farmacia-fidelizacao_clientes.png')
    center 30%/cover no-repeat;
  filter: brightness(0.9) saturate(1.05);
}

/* BLOCO AZUL SÓLIDO — topo (zona de texto) */
.block-top {
  position:absolute;
  top:0; left:0; right:0; height:490px;
  background: #009fe3;
  clip-path: polygon(0 0, 100% 0, 100% 80%, 73% 100%, 27% 100%, 0 80%);
}

/* OVERLAY LEVE no fundo — unifica tom */
.overlay-bottom {
  position:absolute;
  bottom:0; left:0; right:0; height:420px;
  background: linear-gradient(0deg, rgba(0,80,180,.72) 0%, transparent 100%);
}

/* FORMAS GEOMÉTRICAS — contorno branco (brand signature) */
.geo {
  position:absolute;
  border: 2.5px solid rgba(255,255,255,.45);
  transform: rotate(45deg);
  background: transparent;
}
/* Losango grande topo-esquerda */
.g1 { top:-120px; left:-120px; width:460px; height:460px; }
/* Losango médio topo-direita */
.g2 { top:-80px; right:-80px; width:340px; height:340px; }
/* Losango pequeno centro-direita */
.g3 { top:320px; right:-40px; width:180px; height:180px; border-width:2px; border-color:rgba(255,255,255,.30); }
/* Losango fundo-esquerda */
.g4 { bottom:-100px; left:-100px; width:300px; height:300px; border-width:2px; border-color:rgba(255,255,255,.20); }

/* CONTEÚDO — zona segura 108px */
.content {
  position:relative; z-index:20;
  width:100%; height:100%;
  display:flex; flex-direction:column;
  align-items:center;
  padding: 100px 108px 108px;
  justify-content:space-between;
}

/* TOPO */
.top { display:flex; flex-direction:column; align-items:center; text-align:center; }

.logo { height:40px; filter:brightness(0) invert(1); margin-bottom:36px; }

.headline {
  font-size:54px; font-weight:900;
  color:#fff;
  line-height:1.1;
  letter-spacing:-.025em;
  max-width:820px;
  margin-bottom:20px;
  text-shadow: 0 2px 12px rgba(0,0,0,.18);
}

.subtext {
  font-size:26px; font-weight:600;
  color:rgba(255,255,255,.92);
  line-height:1.45;
  max-width:700px;
  letter-spacing:-.01em;
}
.subtext strong { font-weight:900; color:#fff; }

/* FUNDO */
.bottom {
  display:flex; flex-direction:column;
  align-items:center; text-align:center; gap:18px;
}

.tagline {
  font-size:18px; font-weight:700;
  color:rgba(255,255,255,.80);
  letter-spacing:.04em;
  text-transform:uppercase;
}

.pills {
  display:flex; gap:12px; flex-wrap:wrap; justify-content:center;
}
.pill {
  background:rgba(255,255,255,.18);
  border: 1.5px solid rgba(255,255,255,.35);
  border-radius:100px;
  padding:10px 22px;
  color:#fff; font-size:16px; font-weight:700;
}
</style>
</head>
<body>
<div class="ad">
  <div class="photo"></div>
  <div class="block-top"></div>
  <div class="overlay-bottom"></div>

  <div class="geo g1"></div>
  <div class="geo g2"></div>
  <div class="geo g3"></div>
  <div class="geo g4"></div>

  <div class="content">
    <div class="top">
      <img src="https://prosystemnet.com/wp-content/uploads/2025/11/Design-sem-nome-3-1.png" class="logo" alt="ProSystem">
      <div class="headline">Sua farmácia vende todo dia.<br>Mas você sabe quanto<br>sobra de verdade?</div>
      <div class="subtext">Descubra a margem real de cada produto com o <strong>ProSystem.</strong></div>
    </div>

    <div class="bottom">
      <div class="pills">
        <div class="pill">100% offline</div>
        <div class="pill">PDV + SNGPC</div>
        <div class="pill">16 anos de especialização</div>
      </div>
      <div class="tagline">prosystemnet.com</div>
    </div>
  </div>
</div>
</body>
</html>
