<style>
:root{--line:#D9E1EC}
*{box-sizing:border-box}body{margin:0;background:#fff}
h4{margin:0}
.fila{display:flex;flex-wrap:wrap;gap:16px;padding:12px;align-items:flex-start}
.fila .post{width:300px;flex:0 0 300px}
.post img{max-width:none}
.post{container-type:inline-size;aspect-ratio:4/5;position:relative;overflow:hidden;border-radius:3px;box-shadow:0 0 0 1px var(--line);max-width:100%}
.p{--u:calc(100cqw/1080);position:absolute;inset:0;overflow:hidden;font-family:'Montserrat',Arial,sans-serif;color:#fff;font-weight:400}
.azul{background:linear-gradient(155deg,#2E6DB4 0%,#417ABC 48%,#3898D8 78%,#38C8F8 100%)}
.lar{background:linear-gradient(155deg,#B83C0A 0%,#D9500B 50%,#F07A12 85%,#F88818 100%)}
.bra{background:#fff;color:#081330}
.g{position:absolute;transform:rotate(45deg);border-radius:calc(46*var(--u));border:calc(3.5*var(--u)) solid rgba(255,255,255,.75)}
.gf{position:absolute;transform:rotate(45deg);border-radius:calc(46*var(--u));background:linear-gradient(135deg,rgba(56,200,248,.95),rgba(65,122,188,.55))}
.bra .g{border-color:#38C8F8}.bra .g.b{border-color:#417ABC}
.lar .gf,.lb .gf{background:linear-gradient(135deg,rgba(255,190,120,.75),rgba(234,88,12,.35))}
.lb .g{border-color:#F88818}.lb .g.b{border-color:#C2410C}
.lg{position:absolute;top:calc(66*var(--u));left:50%;transform:translateX(-50%);width:calc(324*var(--u));height:auto;border:0;border-radius:0}
.c{position:absolute;left:calc(90*var(--u));right:calc(90*var(--u));text-align:center;display:flex;flex-direction:column;align-items:center;gap:calc(30*var(--u))}
.t{margin:0;font-size:calc(80*var(--u));line-height:1.06;font-weight:300;letter-spacing:-.015em;text-wrap:balance}.t b{font-weight:800}.up{text-transform:uppercase}
.s{margin:0;font-size:calc(35*var(--u));line-height:1.3;font-weight:500;max-width:none;text-wrap:balance}.s b{font-weight:800}
.bar{padding:calc(22*var(--u)) calc(36*var(--u));border-radius:calc(18*var(--u));background:#2E6DB4;color:#fff;font-size:calc(33*var(--u));line-height:1.28;font-weight:500}.bar b{font-weight:800}
.pl{display:inline-block;padding:calc(15*var(--u)) calc(36*var(--u));border-radius:calc(99*var(--u));font-size:calc(28*var(--u));font-weight:800;background:#F88818;color:#081330}
.pl.o{background:transparent;border:calc(3*var(--u)) solid #fff;color:#fff;font-weight:700}.pl.w{background:#fff;color:#B83C0A}
.azultxt{color:#2E6DB4}.lartxt{color:#C2410C}
.ph{position:absolute;object-fit:cover;border:0;max-width:none}
.pen-s{position:absolute;right:calc(42*var(--u));top:calc(190*var(--u));height:calc(1090*var(--u));width:auto;transform:rotate(9deg);filter:drop-shadow(calc(-14*var(--u)) calc(22*var(--u)) calc(26*var(--u)) rgba(8,19,48,.4))}
.q{font-size:calc(210*var(--u));line-height:.7;font-weight:800;color:#38C8F8;height:calc(96*var(--u))}

</style>
